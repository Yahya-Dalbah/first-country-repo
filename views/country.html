<div class="container mt-4">
  <div class="card shadow-sm">
    <img
      ng-src="{{ $ctrl.country.flags.png }}"
      class="card-img-top"
      alt="Flag"
      width="100"
      height="250"
    />
    <div class="p-4">
      <h1 class="fs-3 fw-bolder mb-4" >{{ $ctrl.country.name.common }}</h1>
      <p><span class="fw-bold">population</span>: {{$ctrl.country.population}}</p>
      <p><span class="fw-bold">Region</span>: {{ $ctrl.country.region }}</p>
      <p><span class="fw-bold">Capital</span>: {{ $ctrl.country.capital[0] }}</p>
    </div>
  </div>
</div>
